<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Something is waiting for you ✨</title>
  <meta name="description" content="Opens at 12:00 AM · 28 November. Sound on.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070B1A">
  <meta name="color-scheme" content="dark">
  <style>
    html { height: 100%; background: #070b1a; }
    body {
      margin: 0; min-height: 100%; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
      background: #070b1a radial-gradient(120% 80% at 50% 0%, #1b2450 0%, #101736 38%, #070b1a 78%) no-repeat;
      color: #f5efe2; font-family: Jost, 'Segoe UI', Roboto, system-ui, sans-serif; text-align: center;
    }
    main { max-width: 22rem; }
    .flame {
      width: 1.5rem; height: 2.25rem; margin: 0 auto 2rem; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
      background: radial-gradient(60% 60% at 50% 70%, #fff6dc 0%, #e8c16a 55%, rgba(232, 193, 106, 0) 100%);
      box-shadow: 0 0 44px rgba(232, 193, 106, 0.55);
    }
    h1 { margin: 0 0 2.5rem; font-family: 'Bodoni Moda', 'Times New Roman', serif; font-size: 1.9375rem; font-weight: 500; line-height: 1.15; }
    a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 3.5rem; padding: 0.75rem 2rem;
      border-radius: 999px; background: linear-gradient(135deg, #b8893a 0%, #e8c16a 28%, #fbeec4 50%, #e8c16a 72%, #b8893a 100%);
      color: #070b1a; font-size: 1rem; font-weight: 600; letter-spacing: 0.03em; text-decoration: none;
      box-shadow: 0 10px 28px -8px rgba(232, 193, 106, 0.55);
    }
  </style>
</head>
<body>
  <main>
    <div class="flame" aria-hidden="true"></div>
    <h1>Raasta bhool gayi? Main yahin hoon.</h1>
    <a href="./">Aage chalo</a>
  </main>
</body>
</html>
